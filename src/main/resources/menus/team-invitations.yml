config-version: 4
title: '<color:#7dd7ff><shadow:#17384d:1>REQUESTS</shadow></color>'
size: 54
open-sound: 'block.enchantment_table.use'

content-slots: [10-16, 19-25, 28-34, 37-43]

sounds:
  accept: 'block.beacon.activate'
  decline: 'entity.item.break'
  return: 'item.book.page_turn'
  error: 'entity.villager.no'

items:
  edge:
    material: BLACK_STAINED_GLASS_PANE
    name: '<dark_gray>·</dark_gray>'
    slots: [1-7, 9, 17, 18, 26, 27, 35, 36, 44, 46-52]
  corner:
    material: CYAN_STAINED_GLASS_PANE
    name: '<color:#7dd7ff>•</color>'
    slots: [0, 8, 45, 53]
  header:
    material: PAPER
    slot: 4
    slots: [4]
    name: '<color:#7dd7ff>Requests</color>'
    lore:
      - '<dark_gray>{page}</dark_gray><gray>/</gray><white>{pages}</white>'
      - '<gray>Incoming requests.</gray>'
  invitation:
    material: PLAYER_HEAD
    name: '<yellow>{player}</yellow>'
    lore:
      - '<green>Left</green> <gray>accept</gray>'
      - '<red>Right</red> <gray>decline</gray>'
  empty:
    material: GRAY_DYE
    slot: 22
    name: '<gray>Empty</gray>'
    lore:
      - '<dark_gray>No active requests.</dark_gray>'
  previous:
    material: ARROW
    slot: 47
    name: '<color:#ffdf6b>Previous</color>'
    lore:
      - '<gray>Prev page.</gray>'
  next:
    material: ARROW
    slot: 51
    name: '<color:#ffdf6b>Next</color>'
    lore:
      - '<gray>Next page.</gray>'
  return:
    material: SPECTRAL_ARROW
    slot: 49
    name: '<color:#7dd7ff>Return</color>'
    lore:
      - '<gray>Back to party.</gray>'
