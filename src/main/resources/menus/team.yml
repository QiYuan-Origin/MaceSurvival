config-version: 5
title: '<color:#7dd7ff><shadow:#17384d:1>PARTY</shadow></color>'
size: 54
open-sound: 'block.beacon.power_select'

navigation:
  close-as-return: false
  return-command: 'menu'

roles:
  leader: 'LEADER'
  member: 'MEMBER'

member-slots: [20, 21, 23, 24]

sounds:
  invite: 'item.book.page_turn'
  invitations: 'block.enchantment_table.use'
  member: 'ui.button.click'
  leave: 'entity.item.break'
  close: 'block.iron_door.close'

items:
  edge:
    material: BLACK_STAINED_GLASS_PANE
    name: '<dark_gray>·</dark_gray>'
    slots: [1-7, 9, 17, 18, 26, 27, 35, 36, 44, 46-52]
  corner:
    material: RED_STAINED_GLASS_PANE
    name: '<color:#ff4f68>•</color>'
    slots: [0, 8, 45, 53]
  header:
    material: MACE
    slot: 4
    slots: [4]
    name: '<color:#7dd7ff>Party</color>'
    lore:
      - '<gray>{team_size}</gray><dark_gray>/</dark_gray><color:#91ff6d>{max_size}</color>'
      - '<gray>Leader controls drop.</gray>'
  member-self:
    material: PLAYER_HEAD
    name: '<color:#91ff6d>{player}</color>'
    lore:
      - '<dark_gray>{role}</dark_gray>'
      - '<gray>You.</gray>'
  member-leader:
    material: PLAYER_HEAD
    name: '<color:#ffdf6b>{player}</color>'
    lore:
      - '<dark_gray>{role}</dark_gray>'
      - '<gray>Drop leader.</gray>'
  member:
    material: PLAYER_HEAD
    name: '<color:#7dd7ff>{player}</color>'
    lore:
      - '<dark_gray>{role}</dark_gray>'
      - '<green>Left</green> <gray>leader</gray>'
      - '<red>Right</red> <gray>kick</gray>'
  invite:
    material: WRITABLE_BOOK
    slot: 30
    name: '<color:#91ff6d>Invite</color>'
    lore:
      - '<dark_gray>30s request.</dark_gray>'
  invitations:
    material: PAPER
    slot: 32
    name: '<color:#7dd7ff>Requests</color>'
    lore:
      - '<dark_gray>Pending</dark_gray> <white>{count}</white>'
      - '<gray>Open requests.</gray>'
  leave:
    material: RED_DYE
    slot: 40
    name: '<color:#ff4f68>Leave</color>'
    lore:
      - '<gray>Leave party.</gray>'
  locked:
    material: BARRIER
    slot: 31
    name: '<color:#ff4f68>Locked</color>'
    lore:
      - '<gray>Drop already started.</gray>'
  navigation:
    material: BARRIER
    slot: 49
    name: '<color:#ff4f68>Close</color>'
    lore:
      - '<gray>Back out.</gray>'
