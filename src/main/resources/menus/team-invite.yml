config-version: 2
title: '<font:minecraft:uniform><white><shadow:#404040:1>ɪɴᴠɪᴛᴇ</shadow></white></font>'
size: 54
open-sound: 'item.book.page_turn'

content-slots: [10-16, 19-25, 28-34, 37-43]

sounds:
  invite: 'entity.experience_orb.pickup'
  page: 'item.book.page_turn'
  return: 'item.book.page_turn'
  error: 'entity.villager.no'

items:
  edge:
    material: BLACK_STAINED_GLASS_PANE
    name: '<font:minecraft:uniform><dark_gray>frame</dark_gray></font>'
    lore:
      - '<gray> '
    slots: [1-7, 9, 17, 18, 26, 27, 35, 36, 44, 46-52]
  corner:
    material: LIME_STAINED_GLASS_PANE
    name: '<font:minecraft:uniform><green><shadow:#143010:1>corner</shadow></green></font>'
    lore:
      - '<gray> '
    slots: [0, 8, 45, 53]
  header:
    material: WRITABLE_BOOK
    slot: 4
    slots: [4]
    name: '<font:minecraft:uniform><green><shadow:#143010:1>Invite</shadow></green></font>'
    lore:
      - '<dark_gray>Page</dark_gray> <white>{page}</white><gray>/</gray><white>{pages}</white>'
      - '<gray>Select a waiting player.</gray>'
  player:
    material: PLAYER_HEAD
    name: '<font:minecraft:uniform><aqua>{player}</aqua></font>'
    lore:
      - '<dark_gray>Party size</dark_gray> <white>{team_size}</white>'
      - '<green>Click</green> <gray>send request.</gray>'
  empty:
    material: GRAY_DYE
    slot: 22
    name: '<font:minecraft:uniform><gray>[ Empty ]</gray></font>'
    lore:
      - '<dark_gray>No eligible waiting player is online.</dark_gray>'
  previous:
    material: ARROW
    slot: 47
    name: '<font:minecraft:uniform><yellow>[ Previous ]</yellow></font>'
    lore:
      - '<gray>Previous player page.</gray>'
  next:
    material: ARROW
    slot: 51
    name: '<font:minecraft:uniform><yellow>[ Next ]</yellow></font>'
    lore:
      - '<gray>Next player page.</gray>'
  return:
    material: SPECTRAL_ARROW
    slot: 49
    name: '<font:minecraft:uniform><aqua>[ Return ]</aqua></font>'
    lore:
      - '<gray>Back to party.</gray>'
