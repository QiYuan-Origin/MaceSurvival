  chest-spawn-failed: '<red>No clean nearby surface for a loot chest.</red>'

stats:
  unavailable: '<red>Stats service unavailable.</red>'
  player-not-found: '<red>No stats for <white>{player}</white>.</red>'
  view:
    - '<font:minecraft:uniform><color:#ff6464>{player}</color> <dark_gray>-</dark_gray> <white>STATS</white></font>'
    - '<gray>Games <white>{games}</white>  Wins <green>{wins}</green>  WR <aqua>{win_rate}%</aqua></gray>'
    - '<gray>Kills <white>{kills}</white>  Deaths <red>{deaths}</red>  K/D <yellow>{kd}</yellow></gray>'
    - '<gray>Kill rank <white>#{rank}</white></gray>'

lobby:
  joined: '<gray>Queued.</gray> <dark_gray>Party / Loadout in hotbar.</dark_gray>'
  countdown-cancelled: '<yellow>Queue held.</yellow> <dark_gray>Not enough players.</dark_gray>'
  settings-locked: '<red>Locked.</red> <dark_gray>Drop already started.</dark_gray>'
  loadout-reset: '<green>Loadout reset.</green> <dark_gray>1 / 2 / 8 / 9</dark_gray>'
  loadout-no-slot: '<red>No open slot.</red>'
  hotbar:
    team:
      name: '<font:minecraft:uniform><color:#ff5555><shadow:#401818:1>Party</shadow></color></font>'
      lore: '<dark_gray>Invite / team drop.</dark_gray>'
    loadout:
      name: '<font:minecraft:uniform><aqua><shadow:#103040:1>Loadout</shadow></aqua></font>'
      lore: '<dark_gray>Starter slot order.</dark_gray>'
    visibility:
      shown-name: '<font:minecraft:uniform><green><shadow:#143010:1>Players: All</shadow></green></font>'
      shown-lore: '<dark_gray>Click: party only.</dark_gray>'
