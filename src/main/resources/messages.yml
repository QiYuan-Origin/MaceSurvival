  bundle-capacity: '<gray>{count}/{capacity} equipment</gray>'
  bundle-eject: '<dark_gray>Right click to throw the last item.</dark_gray>'
  bundle-stored: '<aqua>Extra equipment moved to Reserve Bundle.</aqua>'

chat:
