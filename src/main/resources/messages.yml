  stopped: '<red>Match stopped.</red>'
  reconnect-restored: '<green>Reconnected.</green> <dark_gray>State restored.</dark_gray>'
  reconnect-expired: '<red>Expired.</red> <dark_gray>Spectating.</dark_gray>'
  deployment-jump: '<yellow>Captain jumped.</yellow> <dark_gray>Party dropping.</dark_gray>'
  deployment-forced: '<red>Forced drop.</red>'
  border-moving: '<color:#ff5555>Zone moving.</color>'
  eliminated: '<red>Eliminated.</red>'
  winner: '<white>{winner}</white> <green>won Mace Survival.</green>'
  draw: '<dark_gray>No survivors.</dark_gray>'

