config-version: 4

prefix: '<font:minecraft:uniform><color:#ff6464><shadow:#401818:1>ᴍᴀᴄᴇ</shadow></color> <dark_gray>»</dark_gray> </font>'

general:
  no-permission: '<red>No permission.</red>'
  player-only: '<red>Player command only.</red>'
  unknown-command: '<red>Unknown command. Try <white>/{label} help</white>.</red>'
  unknown-command-hidden: '<red>Unknown command.</red>'
  player-or-invitation-not-found: '<red>Player or request not found.</red>'
  config-reloaded: '<green>Reloaded.</green> <gray>Missing defaults were restored.</gray>'
  config-reload-failed: '<red>Reload failed.</red> <gray>Check console.</gray>'

command:
  team-usage: '<yellow>Usage</yellow> <gray>/{label} team [invite|accept|decline|leave|kick|transfer|list] [player]</gray>'
  stats-usage: '<yellow>Usage</yellow> <gray>/{label} stats [player]</gray>'

help:
  header: '<font:minecraft:uniform><color:#ff6464><shadow:#401818:1>ᴍᴀᴄᴇ</shadow></color> <dark_gray>-</dark_gray> <white>COMMANDS</white></font>'
  team: '<gray>/{label} team</gray> <dark_gray>-</dark_gray> <white>Party menu and party commands</white>'
  loadout: '<gray>/{label} loadout</gray> <dark_gray>-</dark_gray> <white>Starter weapon slots</white>'
  stats: '<gray>/{label} stats [player]</gray> <dark_gray>-</dark_gray> <white>Lifetime stats</white>'
  admin-start: '<red>/{label} start</red> <dark_gray>-</dark_gray> <white>Force normal start flow</white>'
  admin-stop: '<red>/{label} stop</red> <dark_gray>-</dark_gray> <white>Stop current match</white>'
  admin-reload: '<red>/{label} reload</red> <dark_gray>-</dark_gray> <white>Reload config files</white>'
  admin-setlobby: '<red>/{label} setlobby</red> <dark_gray>-</dark_gray> <white>Set lobby spawn</white>'
  admin-chest: '<red>/{label} chest [nearest|tp|spawn]</red> <dark_gray>-</dark_gray> <white>Debug loot chests</white>'

admin:
  start-requested: '<green>Start flow forced.</green>'
  start-failed: '<yellow>Cannot start from this phase.</yellow>'
  stop-complete: '<green>Match stopped.</green>'
  stop-none: '<yellow>No active match.</yellow>'
  setlobby-player-only: '<red>Set lobby in-game.</red>'
  setlobby-complete: '<green>Lobby spawn updated.</green>'
  chest-usage: '<yellow>Usage</yellow> <gray>/{label} chest nearest [any|1|2|3]</gray> <dark_gray>/</dark_gray> <gray>/{label} chest tp [any|1|2|3]</gray> <dark_gray>/</dark_gray> <gray>/{label} chest spawn [1|2|3]</gray>'
  chest-none: '<red>No managed loot chest found in this world.</red>'
  chest-nearest: '<gray>Nearest <white>{tier}★</white> chest: <aqua>{world}</aqua> <white>{x}</white> <white>{y}</white> <white>{z}</white> <dark_gray>({distance}m)</dark_gray></gray>'
  chest-teleported: '<green>Teleported to <white>{tier}★</white> chest.</green> <dark_gray>{x} {y} {z}</dark_gray>'
  chest-spawned: '<green>Spawned <white>{tier}★</white> chest.</green> <dark_gray>{x} {y} {z}</dark_gray>'
  chest-spawn-failed: '<red>No clean nearby surface for a loot chest.</red>'

stats:
  unavailable: '<red>Stats service unavailable.</red>'
  player-not-found: '<red>No stats for <white>{player}</white>.</red>'
  view:
    - '<font:minecraft:uniform><color:#ff6464>{player}</color> <dark_gray>-</dark_gray> <white>STATS</white></font>'
    - '<gray>Games <white>{games}</white>  Wins <green>{wins}</green>  WR <aqua>{win_rate}%</aqua></gray>'
    - '<gray>Kills <white>{kills}</white>  Deaths <red>{deaths}</red>  K/D <yellow>{kd}</yellow></gray>'
    - '<gray>Kill rank <white>#{rank}</white></gray>'

lobby:
  joined: '<gray>Lobby joined.</gray> <dark_gray>Party, layout and visibility are in your hotbar.</dark_gray>'
  countdown-cancelled: '<yellow>Countdown cancelled.</yellow> <gray>Not enough players.</gray>'
  settings-locked: '<red>Locked after drop starts.</red>'
  loadout-reset: '<green>Loadout reset.</green>'
  loadout-no-slot: '<red>No free hotbar slot.</red>'
  hotbar:
    team:
      name: '<font:minecraft:uniform><color:#ff6464><shadow:#401818:1>[ Party ]</shadow></color></font>'
      lore: '<gray>Invite, kick and manage teammates.</gray>'
    loadout:
      name: '<font:minecraft:uniform><aqua><shadow:#103040:1>[ Loadout ]</shadow></aqua></font>'
      lore: '<gray>Choose where starter weapons land.</gray>'
    visibility:
      shown-name: '<font:minecraft:uniform><green><shadow:#143010:1>[ Players: All ]</shadow></green></font>'
      shown-lore: '<gray>Click to show party players only.</gray>'
      hidden-name: '<font:minecraft:uniform><gray><shadow:#202020:1>[ Players: Party ]</shadow></gray></font>'
      hidden-lore: '<gray>Click to show everyone.</gray>'

team:
  created: '<green>Party created.</green>'
  disbanded: '<yellow>Party disbanded.</yellow>'
  done: '<green>Party updated.</green>'
  unknown-action: '<red>Unknown party action.</red>'
  invite-sent: '<green>Request sent to <white>{player}</white>.</green>'
  invite-received: '<white>{player}</white> <gray>invited you to a party.</gray>'
  invite-expired: '<yellow>Request expired.</yellow>'
  invite-declined: '<yellow>Request declined.</yellow>'
  joined: '<green>Joined party.</green>'
  member-joined: '<white>{player}</white> <green>joined your party.</green>'
  left: '<yellow>Left party.</yellow>'
  kicked: '<red>You were removed from the party.</red>'
  member-kicked: '<white>{player}</white> <yellow>was removed.</yellow>'
  leader-transferred: '<green><white>{player}</white> is party leader.</green>'
  you-are-leader: '<green>You are party leader.</green>'
  list: '<gray>Party <white>{size}/{max}</white>: <aqua>{members}</aqua></gray>'
  full: '<red>Party is full.</red>'
  friendly-hit: '<gray>Friendly hit blocked.</gray>'
  result:
    locked: '<red>Party is locked.</red>'
    not-leader: '<red>Only leader can do that.</red>'
    not-in-team: '<yellow>You are not in a party.</yellow>'
    not-a-member: '<red>That player is not in your party.</red>'
    team-full: '<red>Party is full.</red>'
    target-already-in-team: '<red>That player is already in a party.</red>'
    already-member: '<yellow>Already in your party.</yellow>'
    cannot-target-self: '<red>You cannot target yourself.</red>'
    invitation-not-found: '<red>Request no longer exists.</red>'

game:
  countdown: '<gray>Drop in <white>{seconds}s</white>.</gray>'
  stopped: '<red>Match stopped by staff.</red>'
  reconnect-restored: '<green>Reconnected.</green> <gray>Your match state was restored.</gray>'
  reconnect-expired: '<red>Reconnect window expired.</red> <gray>You are spectating.</gray>'
  deployment-jump: '<yellow>Leader jumped.</yellow> <gray>Party is dropping.</gray>'
  deployment-forced: '<red>Forced drop.</red>'
  border-moving: '<red>Zone is moving.</red>'
  eliminated: '<red>Eliminated.</red>'
  winner: '<white>{winner}</white> <green>won Mace Survival.</green>'
  draw: '<gray>No players survived.</gray>'

deployment:
  ride-title: '<font:minecraft:uniform><color:#ff6464><shadow:#401818:1>{team}</shadow></color></font>'
  ride-subtitle: '<gray>Leader can jump early. Full party drops at 30s.</gray>'
  ride-actionbar: '<gray>Look where you want to glide. Y velocity stays locked.</gray>'
  drop-actionbar: '<color:#ff6464>Drop started.</color> <gray>Steer with your view.</gray>'

title:
  victory: '<font:minecraft:uniform><green><shadow:#153d20:1>VICTORY</shadow></green></font>'
  victory-subtitle: '<gray>Your party survived.</gray>'
  defeat: '<font:minecraft:uniform><red><shadow:#401818:1>ELIMINATED</shadow></red></font>'
  defeat-subtitle: '<gray>Spectating remaining players.</gray>'

death:
  mace: '<{killer_color}>{killer}</{killer_color}> <gray>shattered</gray> <red><strikethrough>{victim}</strikethrough></red> <gray>with a mace.</gray>'
  sword: '<{killer_color}>{killer}</{killer_color}> <gray>cut down</gray> <red><strikethrough>{victim}</strikethrough></red><gray>.</gray>'
  axe: '<{killer_color}>{killer}</{killer_color}> <gray>split</gray> <red><strikethrough>{victim}</strikethrough></red><gray>.</gray>'
  spear: '<{killer_color}>{killer}</{killer_color}> <gray>pierced</gray> <red><strikethrough>{victim}</strikethrough></red><gray>.</gray>'
  generic: '<red><strikethrough>{victim}</strikethrough></red> <gray>was eliminated.</gray>'

combat:
  enchant-applied: '<font:minecraft:uniform><gray>Applied <aqua>{enchantment} {level}</aqua>.</gray></font>'
  armor-equipped: '<font:minecraft:uniform><gray>Equipped <aqua>{item}</aqua>.</gray></font>'
  durability-combined: '<font:minecraft:uniform><green>Durability combined.</green></font>'
  weapon-absorbed: '<font:minecraft:uniform><light_purple>Weapon absorbed.</light_purple></font>'
  armor-enchanted: '<font:minecraft:uniform><gray>Armor gained <aqua>{enchantment} {level}</aqua>.</gray></font>'
  boost-damage: '<font:minecraft:uniform><red>Permanent damage +{percent}%</red></font>'
  boost-healing: '<font:minecraft:uniform><green>Permanent healing +{percent}%</green></font>'
  boost-next-kill: '<font:minecraft:uniform><aqua>Next kill empowered.</aqua></font>'
  boost-triggered: '<font:minecraft:uniform><aqua>Hunter Boon:</aqua> {boost}</font>'
  boost-triggered-damage: '<red>+{percent}% damage</red>'
  boost-triggered-healing: '<green>+{percent}% healing</green>'
  boost-item:
    damage:
      name: '<font:minecraft:uniform><red>Brutality</red></font>'
      lore: '<gray>Permanent damage boost.</gray>'
    healing:
      name: '<font:minecraft:uniform><green>Vitality</green></font>'
      lore: '<gray>Permanent healing boost.</gray>'
    next-kill:
      name: '<font:minecraft:uniform><aqua>Hunter Boon</aqua></font>'
      lore: '<gray>Next kill grants a permanent boost.</gray>'
  bundle-name: '<font:minecraft:uniform><aqua>Reserve Bundle</aqua></font>'
  bundle-capacity: '<gray>{count}/{capacity} equipment</gray>'
  bundle-eject: '<dark_gray>Right click to throw the last item.</dark_gray>'
  bundle-stored: '<aqua>Extra equipment moved to Reserve Bundle.</aqua>'

chat:
  format: '<{color}>{player}</{color}> <dark_gray>:</dark_gray> <white>{message}</white>'

tab:
  player: '<font:minecraft:uniform><dark_gray>[</dark_gray><{color}>{team_label}</{color}><dark_gray>]</dark_gray> <{color}>{player}</{color}></font>'
  header:
    - '<font:minecraft:uniform><white><shadow:#404040:1>ᴍᴀᴄᴇ</shadow></white> <color:#ff6464><shadow:#401818:1>ꜱᴜʀᴠɪᴠᴀʟ</shadow></color></font>'
    - '<dark_gray>{server}</dark_gray> <gray>|</gray> <white>{online}</white><gray>/{max}</gray>'
  footer:
    - '<gray>{phase}</gray> <dark_gray>|</dark_gray> <gray>Alive <white>{alive}</white></gray> <dark_gray>|</dark_gray> <gray>Party <{color}>{team_size}/4</{color}></gray>'

scoreboard:
  title: '<font:minecraft:uniform><white><shadow:#404040:1>ᴍᴀᴄᴇ</shadow></white> <color:#ff6464><shadow:#401818:1>ꜱᴜʀᴠɪᴠᴀʟ</shadow></color></font>'
  lobby-status: '<font:minecraft:uniform><dark_gray>Queue</dark_gray> <white>{waiting}</white><gray>/</gray><white>{minimum}</white></font>'
  lobby-needed: '<font:minecraft:uniform><dark_gray>Need</dark_gray> <red>{needed}</red> <gray>more players</gray></font>'
  lobby-countdown: '<font:minecraft:uniform><dark_gray>Drop</dark_gray> <color:#ff6464>{seconds}s</color></font>'
  lobby-team: '<font:minecraft:uniform><dark_gray>Party</dark_gray> <{color}>{team_size}</{color}><gray>/</gray><white>{max_size}</white></font>'
  time-border: '<font:minecraft:uniform><dark_gray>Match</dark_gray> <white>{time}</white> <gray>/</gray> <dark_gray>Border</dark_gray> <white>{border}m</white></font>'
  time-border-moving: '<font:minecraft:uniform><dark_gray>Match</dark_gray> <white>{time}</white> <gray>/</gray> <dark_gray>Border</dark_gray> <red>{border}m</red></font>'
  alive: '<font:minecraft:uniform><dark_gray>Alive</dark_gray> <white>{alive}</white></font>'
  kills: '<font:minecraft:uniform><dark_gray>Kills</dark_gray> <white>{kills}</white> <gray>#</gray><white>{rank}</white></font>'
  team-kills: '<font:minecraft:uniform><dark_gray>Team</dark_gray> <white>{kills}</white> <gray>#</gray><white>{rank}</white></font>'
  teammates: '<font:minecraft:uniform><dark_gray>Team Track</dark_gray></font>'
  teammate: '<font:minecraft:uniform><gray>{direction}</gray> <{color}>{name}</{color}> <dark_gray>{distance}</dark_gray><gray>m</gray></font>'
  teammate-unknown: '<font:minecraft:uniform><dark_gray>-</dark_gray> <{color}>{name}</{color}> <dark_gray>--</dark_gray><gray>m</gray></font>'
  teammate-dead: '<font:minecraft:uniform><red><strikethrough>{name}</strikethrough></red></font>'
  server: '<font:minecraft:uniform><color:#ff6464><shadow:#401818:1>mcqi.top</shadow></color></font>'
