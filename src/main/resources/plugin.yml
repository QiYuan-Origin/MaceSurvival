name: MaceSurvival
version: '${project.version}'
main: org.qiyuan.macesurvival.MaceSurvival
api-version: '1.21.11'
author: QiYuan
description: 重锤大逃杀 · 单端天空降落与小队生存竞技
softdepend: [PlaceholderAPI, Vault, LuckPerms]
commands:
  macesurvival:
    description: 重锤大逃杀
    aliases: [mace, ms]
    usage: /macesurvival help
permissions:
  macesurvival.player:
    description: 使用重锤大逃杀玩家功能
    default: true
    children:
      macesurvival.menu: true
      macesurvival.stats: true
      macesurvival.team: true
      macesurvival.spectate: true
      macesurvival.layout: true
      macesurvival.leaderboard: true
  macesurvival.menu:
    default: true
  macesurvival.stats:
    default: true
  macesurvival.team:
    default: true
  macesurvival.spectate:
    default: true
  macesurvival.layout:
    default: true
  macesurvival.leaderboard:
    default: true
  macesurvival.admin:
    description: 全部重锤大逃杀管理权限
    default: op
    children:
      macesurvival.admin.start: true
      macesurvival.admin.stop: true
      macesurvival.admin.reload: true
      macesurvival.admin.map: true
      macesurvival.admin.loot: true
  macesurvival.admin.start:
    default: op
  macesurvival.admin.stop:
    default: op
  macesurvival.admin.reload:
    default: op
  macesurvival.admin.map:
    default: op
  macesurvival.admin.loot:
    default: op
