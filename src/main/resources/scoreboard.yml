  - <gray>玩家 <white>{players}</white><dark_gray> / </dark_gray>{maximum}
  - <gray>{waiting_hint}</gray>
  - ''
  - <gray>队伍 <white>{squad}</white>
  - ''
  - <gray>{squad_rule}
  - ''
  countdown:
  - ''
  - <gray>阶段 <white>{phase}</white>
  - <gray>开始倒计时 <white>{countdown} 秒</white>
  - <gray>玩家 <white>{players}</white><dark_gray> / </dark_gray>{maximum}
  - ''
  - <gray>队伍 <white>{squad}</white>
  - ''
  - <gray>检查布局，准备进入战场。
  - ''
