config_version: 3
enabled: true
update-ticks: 20
text-shadow: true
nametag:
  squad-prefix: '[{team_id}] '
  eliminated-prefix: '☠ '
title: <white><shadow:#404040:1>重锤大逃杀</shadow></white>
tab:
  header: '<newline><white><shadow:#404040:1>重锤大逃杀</shadow></white><newline><gray>{phase} <dark_gray>·</dark_gray> {players} 位玩家</gray><newline>'
  footer: '<newline><gray>高空降落 <dark_gray>·</dark_gray> 星级补给 <dark_gray>·</dark_gray> 最后幸存者</gray><newline><#D9B86F>你的队伍 · {squad}</#D9B86F><newline>'
server-address: ''
phases:
  booting: 场地准备
  waiting: 等待玩家
  countdown: 即将开始
  dropping: 高空降落
  running: 生存对局
  ending: 本局结算
labels:
  solo: 单人生存
  unteamed: 尚未组队
  solo-allowed-rule: '单人 / 最多 {squad_size} 人自由组队'
  solo-disabled-rule: '需组队 / 每队最多 {squad_size} 人'
  grace: 保护中
  pvp: 战斗中
  waiting-players: 还需 {needed} 人即可开始
  waiting-team-players: 还需 {needed} 名已组队玩家
  waiting-opponent: 等待另一支队伍加入
  ready: 即将开始倒计时
  paused: 等待管理员重新开启
  grace-remaining: 保护中 · {grace} 秒
  border-active: 收缩中
