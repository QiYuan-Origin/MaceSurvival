config_version: 4
title: <!i><white><shadow:#404040:1>重锤大逃杀 · 大厅</shadow></white>
size: 54
open_sound:
  enabled: true
  sound: block.chest.open
  volume: 0.4
  pitch: 1.0
click_sound:
  enabled: true
  sound: ui.button.click
  volume: 0.35
  pitch: 1.0
items:
  border:
    material: GRAY_STAINED_GLASS_PANE
    slots:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    - 8
    - 45
    - 46
    - 47
    - 48
    - 49
    - 50
    - 51
    - 52
    - 53
    display_name: ' '
  info:
    material: COMPASS
    slot: 4
    display_name: <!i><white><shadow:#404040:1>重锤大逃杀</shadow></white>
    lore:
    - <!i><gray>当前阶段：<white>{phase}</white></gray>
    - <!i><gray>{players_summary}</gray>
    - <!i><gray>我的队伍：<white>{squad}</white></gray>
    - <!i><gray></gray>
    - <!i><gray>从高空选择落点，争夺星级补给。</gray>
    - <!i><gray>使用风弹与重锤，在最后的战场存活。</gray>
  stats:
    material: PAPER
    slot: 20
    display_name: <!i><white><shadow:#404040:1>我的战绩</shadow></white>
    lore:
    - <!i><gray>胜利 <white>{wins}</white>　击杀 <white>{kills}</white></gray>
    - <!i><gray>累计场次 <white>{games}</white></gray>
    - <!i><gray>{currency}：<white>{balance}</white></gray>
    - <!i><gray></gray>
    - <!i><gray>点击查看完整生存记录</gray>
  team:
    material: PLAYER_HEAD
    slot: 22
    display_name: <!i><white><shadow:#404040:1>队伍大厅</shadow></white>
    lore:
    - <!i><gray>当前：<white>{squad}</white></gray>
    - <!i><gray>自由组队，每队最多 <white>{squad_size}</white> 人</gray>
    - <!i><gray></gray>
    - <!i><gray>{solo_hint}</gray>
    - <!i><gray>点击创建或加入队伍</gray>
  layout:
    material: CHEST
    slot: 24
    display_name: <!i><white><shadow:#404040:1>快捷栏布局</shadow></white>
    lore:
    - <!i><gray>调整你的开局装备位置</gray>
    - <!i><gray>双重锤、武器与补给分别保存</gray>
    - <!i><gray></gray>
    - <!i><gray>点击编辑个人布局</gray>
  spectate:
    material: SPYGLASS
    slot: 31
    display_name: <!i><white><shadow:#404040:1>观战目标</shadow></white>
    lore:
    - <!i><gray>存活玩家：<white>{alive}</white></gray>
    - <!i><gray>存活队伍：<white>{alive_squads}</white></gray>
    - <!i><gray></gray>
    - <!i><gray>仅旁观者可以进入观战列表</gray>
  close:
    material: BARRIER
    slot: 49
    display_name: <!i><white><shadow:#404040:1>关闭菜单</shadow></white>
    lore: []
phases:
  booting: 场地准备
  waiting: 等待玩家
  countdown: 即将开始
  dropping: 高空降落
  running: 生存对局
  ending: 本局结算
labels:
  solo: 单人生存
  unteamed: 尚未组队
  players-lobby: '可参赛人数：<white>{eligible_players}</white> / 最少 {minimum} 人'
  players-preparing: '准备参赛：<white>{eligible_players}</white> 人'
  players-round: '存活玩家：<white>{alive}</white> / <white>{alive_squads}</white> 个阵营'
  solo-allowed: 单人可直接等待开局。
  solo-disabled: 需加入小队后才能参赛。
root-back:
  material: ARROW
  display_name: <!i><white><shadow:#404040:1>返回服务器主菜单</shadow></white>
  lore:
  - <!i><gray>点击返回服务器主菜单</gray>
hotbar:
  menu:
    material: COMPASS
    display_name: <!i><white><shadow:#404040:1>重锤大逃杀</shadow></white>
    lore:
    - <!i><gray>右键打开玩法菜单</gray>
  stats:
    material: PAPER
    display_name: <!i><white><shadow:#404040:1>我的战绩</shadow></white>
    lore:
    - <!i><gray>右键查看累计战绩</gray>
  team:
    material: PLAYER_HEAD
    display_name: <!i><white><shadow:#404040:1>队伍大厅</shadow></white>
    lore:
    - <!i><gray>右键创建或加入队伍</gray>
feedback:
  round-active: <gray>对局已开始，请在下一局等待阶段调整队伍和布局。</gray>
  no-permission: <gray>你没有使用这个功能的权限。</gray>
  cursor-busy: <gray>请先放回鼠标上的物品，再打开布局编辑。</gray>
