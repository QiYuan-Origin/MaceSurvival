# ═══════════════════════════════════════════════════════════
#              MaceSurvival  ·  Squad Menu
#   Slots are 0-based. Members fill the row given by member-slots.
# ═══════════════════════════════════════════════════════════

config_version: 1

title: '<#7FD962><shadow:#404040:1>Squad</shadow></#7FD962>'
rows: 5

open-sound:
  - 'BLOCK_COPPER_BULB_TURN_ON,0.8,1.0,0'
  - 'BLOCK_VAULT_INSERT_ITEM,0.5,1.0,4'

frame:
  corner-material: LIME_STAINED_GLASS_PANE
  corner-name: '<#7FD962>Nothing to see here'
  corner-lore:
    - '<#5F6368>Clicking does nothing, promise.'
  filler-material: BLACK_STAINED_GLASS_PANE
  filler-name: '<#5F6368>Nothing to see here'
  filler-lore:
    - '<#5F6368>Clicking does nothing, promise.'

items:
  header:
    slot: 4
    material: WHITE_BANNER
    name: '<#7FD962>❰ Squad Tools ❱'
    lore:
      - '<#9AA0A6>Squad: <#F0C674>{squad}'
      - '<#9AA0A6>Size: <#F0C674>{current}</#F0C674><#5F6368>/</#5F6368><#9AA0A6>{max}'
      - '<#5F6368>Squads are locked once the drop begins.'

  # One head per member, laid out left to right and centred.
  member-slots: [ 20, 21, 22, 23 ]
  member:
    material: PLAYER_HEAD
    name: '<#7FD962>❰ {player} ❱'
    lore:
      - '<#9AA0A6>Wins: <#F0C674>{wins}'
      - '<#9AA0A6>Kills: <#F0C674>{kills}'
      - '<#9AA0A6>State: <#F0C674>{role}'
  empty-seat:
    material: LIGHT_GRAY_STAINED_GLASS_PANE
    name: '<#9AA0A6>❰ Open Seat ❱'
    lore:
      - '<#5F6368>Invite somebody to fill it.'

  create:
    slot: 29
    material: NETHER_STAR
    name: '<#F0C674>❰ Form a Squad ❱'
    lore:
      - '<#9AA0A6>Start your own squad and invite up to three.'
      - ''
      - '<#5F6368>Left-click to form.'
    action: 'command:mace team create'

  invite:
    slot: 31
    material: NAME_TAG
    name: '<#7FC9D9>❰ Invite a Diver ❱'
    lore:
      - '<#9AA0A6>Type a name in chat to send an invite.'
      - '<#9AA0A6>Sneak to confirm, type cancel to abort.'
      - ''
      - '<#5F6368>Left-click to type.'
    action: 'input:team-invite'

  leave:
    slot: 33
    material: IRON_DOOR
    name: '<#E05C5C>❰ Leave Squad ❱'
    lore:
      - '<#9AA0A6>Walk away and drop in on your own.'
      - ''
      - '<#5F6368>Left-click to leave.'
    action: 'command:mace team leave'

  back:
    slot: 40
    material: ARROW
    name: '<#E0A45C>❰ Back ❱'
    lore:
      - '<#9AA0A6>Return to the main menu.'
    action: 'menu:main'
