# ═══════════════════════════════════════════════════════════
#            MaceSurvival  ·  Mace Battle Royale
#   Single-server mode. Join = waiting lobby. Mid-round join = spectator.
#   The arena is generated by the plugin, no pre-built map needed.
#
#   Text fields accept ALL of these at once:
#     &a  §a  &x&F&F&0&0&0&0  <#FF0000>  <gradient>  <shadow:#404040:1>
#     and full JSON components.
# ═══════════════════════════════════════════════════════════

# Config version, do not edit by hand. Missing keys are merged in on upgrade.
config_version: 1

# Chat prefix used by every message that is not a help entry.
prefix: '<#C9A227><shadow:#404040:1>✦ MACE</shadow></#C9A227> <#9AA0A6><shadow:#404040:1>»</shadow></#9AA0A6> '

language: en

# ─────────────── Round flow ───────────────
game:
  # Players needed before the countdown starts.
  min-players: 2
  # Round is capped here, extra joins become spectators.
  max-players: 40
  squad-size: 4

  lobby-countdown: 60
  # Countdown is shortened to this once the lobby is full.
  full-lobby-countdown: 15
  # Seconds announced with chat + sound. Others tick silently.
  countdown-announce-at: [ 60, 30, 15, 10, 5, 4, 3, 2, 1 ]

  # Grace period after landing, no PvP damage.
  grace-period: 20
  # Hard round limit, seconds. Reached = the largest squad alive wins.
  time-limit: 1800

  # Seconds the win screen stays up before the server restarts the round.
  end-screen: 12
  # Single-server mode restarts to reset the arena and stats.
  restart-on-end: true

  # Spectators of a finished round keep flying instead of being frozen.
  spectator-fly: true

# ─────────────── Skydive ───────────────
drop:
  # Black screen while the arena is being generated.
  blackout: true
  blackout-fade-in: 10
  blackout-fade-out: 20

  # Spawn height for the dive.
  height: 320
  # Downward momentum applied each tick, blocks/tick.
  fall-speed: 1.6
  # Horizontal steering speed while diving.
  steer-speed: 0.42
  # Y is locked while steering so looking around never slows the fall.
  lock-vertical-look: true

  # Height above ground where the parachute opens and fall damage is cancelled.
  open-at-height: 14
  parachute-fall-speed: 0.22

  trail-particles: true

# ─────────────── Arena generation ───────────────
arena:
  world-name: mace_arena
  # Playable radius from the centre. The border is placed here.
  radius: 400
  # Border shrink is disabled by default, this mode ends on kills and timer.
  shrink-border: false

  seed-mode: random
  # Loot buildings scattered across the arena.
  structures: 26
  min-structure-distance: 48

  # Star-rated chests. Higher stars sit in fewer, riskier spots.
  chests:
    one-star: 60
    two-star: 34
    three-star: 16
    four-star: 6
  # Floating text above each chest showing its star rating.
  chest-hologram: true
  hologram-height: 1.4

# ─────────────── Starting kit ───────────────
# Slots are hotbar 0-8, so 0 is the first hotbar slot.
loadout:
  mace-slot: 0
  food-slot: 1
  block-slot: 2
  wind-charge-slot: 3
  food-amount: 16
  block-amount: 32
  wind-charge-amount: 8
  # Starting mace durability, low on purpose so loot matters.
  mace-durability: 40
  food-material: COOKED_BEEF
  block-material: OAK_PLANKS
  # Lobby hotbar. Set a slot to -1 to hide that item.
  lobby-info-slot: 4
  lobby-info-material: PAPER
  lobby-stats-slot: 0
  lobby-stats-material: BOOK
  lobby-menu-slot: 8
  lobby-menu-material: COMPASS

# ─────────────── Loot behaviour ───────────────
loot:
  # Durability of a picked-up weapon is added to the one in your inventory
  # instead of leaving you two half-broken maces.
  merge-durability: true
  # A weapon that runs out of durability explodes in the wielder's hands.
  durability-explosion: true
  explosion-power: 2.4
  explosion-breaks-blocks: false
  # Enchanted books apply on pickup instead of needing an anvil.
  books-apply-on-pickup: true
  # Right-clicking a weapon with a book in hand also applies it.
  books-apply-on-right-click: true
  # Respect vanilla max levels when a book is applied.
  respect-max-level: false
  absolute-max-level: 10

# ─────────────── Death and kills ───────────────
death:
  # Full gear drops so the killer can loot it.
  drop-gear: true
  drop-inventory: true
  # Seconds a squad member can be revived by a teammate. 0 disables revives.
  revive-window: 0
  spectate-on-death: true
  lightning-on-kill: true

# ─────────────── Scoreboard ───────────────
scoreboard:
  enabled: true
  title: '<#C9A227><shadow:#404040:1>MACE</shadow></#C9A227>'
  update-ticks: 10
  # Server address shown on the last line. Leave blank to hide it.
  server-ip: ''

# ─────────────── Menus ───────────────
menu:
  # Turn the close button into a back button so the plugin menu can hand
  # control back to the server hub menu.
  close-as-back: false
  # Command run by that back button, no leading slash.
  back-command: menu
  click-sounds: true
  # Seconds a chat prompt waits before it gives up.
  input-timeout: 30

# ─────────────── Economy ───────────────
economy:
  # Vault is used when present, otherwise the internal balance is used.
  use-vault: true
  reward-win: 250
  reward-kill: 40
  reward-participation: 10

  # Custom currency, driven purely by commands and a placeholder.
  # {amount} is the amount, {player} is the player name.
  custom:
    enabled: false
    name: 'Coins'
    take-command: 'eco take {player} {amount}'
    give-command: 'eco give {player} {amount}'
    balance-placeholder: '%vault_eco_balance%'
