# Configuration schema version. Missing values are restored on /macesurvival reload.
config-version: 5

server:
  address: mcqi.top
  language: en
  motd:
    enabled: true
    line-1: '§7⚔ §4ᴍᴀᴄᴇ ꜱᴜʀᴠɪᴠᴀʟ §7⚔'
    line-2: '§81.21.11+ §f● §9§lᴍᴀᴄᴇ§f §7| §9§lꜱᴜʀᴠɪᴠᴀʟ§7 §f● §8mcqi.top'
  shutdown-after-match: true
  shutdown-delay-seconds: 8

text:
  prefix: '<color:#E70939><shadow:#3A0612:1>ᴍꜱ</shadow></color> <dark_gray>›</dark_gray> '
  default-font: 'minecraft:default'
  scoreboard-title: '<gray>⚔</gray> <color:#E70939><shadow:#3A0612:1>ᴍᴀᴄᴇ ꜱᴜʀᴠɪᴠᴀʟ</shadow></color> <gray>⚔</gray>'

lobby:
  world: world
  spawn:
    x: 0.5
    y: 65.0
    z: 0.5
    yaw: 0.0
    pitch: 0.0
  void-return-y: 0.0
  hide-players-over: 20
  hotbar:
    team-slot: 0
    loadout-slot: 4
    visibility-slot: 8
  menu:
    root-close-is-return: false
    root-return-command: 'menu'

match:
  world-prefix: macesurvival_match
  generator: AMPLIFIED
  random-seed: true
  seed: 0
  hard-radius: 5000
  min-players: 100
  max-players: 0
  waiting-countdown-seconds: 120
  forced-countdown-seconds: 5
  duration-seconds: 1500
  disconnect-grace-seconds: 240
  pvp-during-deployment: false
  block-breaking: false
  block-placing: false
  natural-mob-spawning: false

teams:
  max-size: 4
  invite-timeout-seconds: 30
  friendly-damage: false
  friendly-knockback: true

deployment:
  blackout-ticks: 40
  altitude-above-surface: 95
  minimum-altitude: 150
  team-separation-blocks: 400
  voluntary-jump-seconds: 15
  forced-jump-seconds: 30
  horizontal-speed: 0.9
  fixed-vertical-start-speed: -1.1
  fall-damage-immunity-ticks-after-landing: 60

starting-loadout:
  sword-slot: 0
  axe-slot: 1
  mace-one-slot: 7
  mace-two-slot: 8
  boots: IRON_BOOTS
  unbreakable: true

border:
  radii: [2500, 2000, 1000, 650, 280, 80, 24]
  total-moving-seconds: 1500
  final-target-change-seconds: 20
  final-center-speed: 3.0
  damage-per-second: 2.0
  warning-distance: 32
  particle-spacing: 4.0
  particle-color: '#E52B2B'
  outside-particle-color: '#650000'

loot:
  chests-per-alive-player: 8
  deployment-nearby-chests: 10
  deployment-nearby-radius: 96.0
  items-min: 5
  items-max: 9
  disappear-delay-seconds: 3
  armor-durability-min: 0.30
  armor-durability-max: 0.90
  chest-tier-weights: [50, 32, 18]
  minimum-chest-spacing: 2
  parallel-chunk-loads: 8
  star-display-view-range: 48

upgrades:
  damage-per-book: 0.03
  damage-maximum-books: 5
  healing-per-book: 0.05
  healing-maximum-books: 5
  kill-mending-percentages: [0.01, 0.03, 0.05]
  maximum-extra-enchantment-levels: 3
  thorns-maximum-level: 4

combat:
  kill-credit-seconds: 30

scoreboard:
  update-ticks: 10
  server-address: mcqi.top
