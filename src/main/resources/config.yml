# MaceSurvival · Paper 1.21.11 / Java 21
# 支持 &、§、MiniMessage、Adventure JSON。材质包暂不需要。
config_version: 4
lobby:
  world: mace_lobby
  build-island: true
  x: 0
  y: 65
  z: 0
  yaw: 0
  welcome: '<white><shadow:#404040:1>重锤大逃杀</shadow></white><newline><gray>选择落点 · 搜集补给 · 存活至终局</gray>'
# 单端：入服加入等待大厅，比赛开始后入服只旁观。
game:
  min-players: 2
  max-players: 64
  lobby-countdown: 45
  grace-period: 20
  time-limit: 1800
  end-screen: 10
  friendly-fire-disabled: true
  # 结算重置本局，不执行重启/关服，生命周期交由服主控制。
  restart-on-end: false
squad:
  size: 4
  allow-solo: true
menu:
  close-as-back: false
  back-command: menu
  input-timeout: 30
drop:
  height: 220
  fall-speed: 1.6
  steer-speed: 0.42
  open-at-height: 14
  blackout-ticks: 25
  lock-vertical-look: false
arena:
  world: mace_arena
  radius: 300
  seed-mode: random
  seed: 20241121
  base-y: 64
  min-structures: 24
  max-structures: 32
  border-shrink-after: 300
  border-shrink-duration: 600
  border-final-size: 24
chest:
  one-star-count: 24
  two-star-count: 16
  three-star-count: 8
  hologram-height: 1.4
loot:
  merge-durability: true
  durability-explosion: true
  explosion-power: 2.4
  respect-max-level: false
  absolute-max-level: 10
loadout:
  sword-slot: 0
  axe-slot: 1
  mace-slot-1: 7
  mace-slot-2: 8
  food-slot: 2
  block-slot: 3
  wind-charge-slot: 4
  food-amount: 16
  block-amount: 32
  wind-charge-amount: 8
  mace-durability: 40
  lobby-menu-slot: 4
  lobby-stats-slot: 0
  lobby-team-slot: 8
sounds:
  menu-open: block.beacon.power_select
  menu-close: block.chest.close
  button-click: ui.button.click
  button-success: entity.player.levelup
  button-error: entity.villager.no
economy:
  currency-name: 金币
  use-vault: true
  rewards:
    participation: 0
    kill: 10
    win: 50
  custom:
    enabled: false
    # 稳定货币标识；修改显示名称时保留此值，离线奖励会按此标识补发。
    id: xiaoqi
    name: 小起币
    take-command: 'eco take {player} {amount}'
    give-command: 'eco give {player} {amount}'
    balance-placeholder: '%vault_eco_balance%'
