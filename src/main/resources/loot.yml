# ═══════════════════════════════════════════════════════════
#              MaceSurvival  ·  Loot tables
#   One table per chest tier. Higher stars roll more slots and
#   unlock the heavier gear.
#
#   Entry format:
#     material: vanilla material name, or MACE for a weapon that
#               carries the plugin durability counter
#     weight:   relative chance inside the table
#     min/max:  stack size rolled per pick
#     durability: only read for MACE, sets the charge counter
#     enchant:  ENCHANT_KEY:LEVEL, applied straight to the item
#     book:     ENCHANT_KEY:LEVEL, produces an enchanted book
# ═══════════════════════════════════════════════════════════

config_version: 1

# Slots rolled per chest. A slot may come up empty on the low tiers,
# which is what makes a one-star cache feel like a gamble.
rolls:
  one-star: 3
  two-star: 4
  three-star: 5
  four-star: 6

# Chance for a rolled slot to come up empty, percent.
empty-chance:
  one-star: 30
  two-star: 15
  three-star: 5
  four-star: 0

tables:
  one-star:
    - material: COOKED_BEEF
      weight: 20
      min: 2
      max: 5
    - material: OAK_PLANKS
      weight: 18
      min: 8
      max: 24
