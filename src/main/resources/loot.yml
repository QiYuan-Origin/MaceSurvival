# Weighted loot for one, two and three star caches. Every rolled item receives
# an independently shuffled chest slot. A larger weight makes an entry likelier.
# Original tables.* lists and legacy one-star/two-star/three-star maps are read.
# Durability is a custom remaining-use counter, mirrored on the native item bar.
config_version: 3

rolls:
  one-star: 5
  two-star: 7
  three-star: 9
empty-chance:
  one-star: 5
  two-star: 0
  three-star: 0

mending:
  # A confirmed player kill restores this fraction of every carried Mending item.
  kill-repair-fraction: 0.25

passive-books:
  # Effects last until the end of the current round. Capped books stay as items.
  max-level: 10
  damage-boost:
    per-level: 0.10
    name: '<!i><#FF8D85>战斗本能'
    lore:
      - '<!i><#B6BEC9>被动附魔书 · 拾取后激活'
      - '<!i><#FFFFFF>获得 {level} 层伤害增益。'
      - '<!i><#B6BEC9>每层提升 {damage_percent}% 伤害，持续至本局结束。'
      - '<!i><#B6BEC9>最多叠加 {max_level} 层。'
  healing-boost:
    per-level: 0.10
    name: '<!i><#8CD9AC>复苏之风'
    lore:
      - '<!i><#B6BEC9>被动附魔书 · 拾取后激活'
      - '<!i><#FFFFFF>获得 {level} 层治疗增益。'
      - '<!i><#B6BEC9>每层提升 {healing_percent}% 治疗，持续至本局结束。'
      - '<!i><#B6BEC9>最多叠加 {max_level} 层。'
  kill-boost:
    heal: 4
    name: '<!i><#E5BC76>乘胜追击'
    lore:
      - '<!i><#B6BEC9>被动附魔书 · 拾取后激活'
      - '<!i><#FFFFFF>储存 {level} 次击杀增益。'
      - '<!i><#B6BEC9>击杀敌人时消耗一层储备，'
      - '<!i><#B6BEC9>获得一层伤害与治疗增益，'
      - '<!i><#B6BEC9>并恢复 {hearts} 颗心（受治疗增益影响）。'

